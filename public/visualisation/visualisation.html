<!DOCTYPE html>
<html>
<head>
    <title>Page Embeddings Visualization</title>
    <link rel="stylesheet" href="../css/visualisation.css">
</head>
<body>
    <div class="controls-container">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Enter text to search...">
            <button id="search-button">Search</button>
        </div>
        <div class="embedding-toggle">
            <label>Embedding</label>
            <label><input type="radio" name="embedding-type" value="full" checked><span class="toggle-option">Full</span></label>
            <label><input type="radio" name="embedding-type" value="skeleton"><span class="toggle-option">Skeleton</span></label>
        </div>
    </div>
    <div id="plot"></div>
    <div id="tooltip" class="tooltip"></div>
    <div class="zoom-controls">
        <button id="zoom-in" class="zoom-button">+</button>
        <button id="zoom-out" class="zoom-button">-</button>
        <button id="reset-zoom" class="zoom-button">R</button>
    </div>
    <script src="visualisation.js" type="module"></script>
</body>
</html>
