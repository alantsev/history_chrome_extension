<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Gradients for clusters -->
    <linearGradient id="cluster1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cluster2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cluster3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="24" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.1" stroke="#fff" stroke-width="0.5">
    <line x1="20" y1="20" x2="20" y2="100"/>
    <line x1="40" y1="20" x2="40" y2="100"/>
    <line x1="60" y1="20" x2="60" y2="100"/>
    <line x1="80" y1="20" x2="80" y2="100"/>
    <line x1="100" y1="20" x2="100" y2="100"/>
    <line x1="20" y1="20" x2="100" y2="20"/>
    <line x1="20" y1="40" x2="100" y2="40"/>
    <line x1="20" y1="60" x2="100" y2="60"/>
    <line x1="20" y1="80" x2="100" y2="80"/>
    <line x1="20" y1="100" x2="100" y2="100"/>
  </g>

  <!-- Connection lines between clusters (representing UMAP edges) -->
  <g stroke="#fff" stroke-opacity="0.15" stroke-width="1" fill="none">
    <path d="M35 38 Q60 50 75 35"/>
    <path d="M35 38 Q45 60 38 78"/>
    <path d="M75 35 Q85 55 82 75"/>
    <path d="M38 78 Q60 85 82 75"/>
  </g>

  <!-- Cluster 1 (Purple - top left) -->
  <g filter="url(#glow)">
    <circle cx="30" cy="35" r="5" fill="url(#cluster1)" opacity="0.7"/>
    <circle cx="40" cy="42" r="6" fill="url(#cluster1)"/>
    <circle cx="28" cy="45" r="4" fill="url(#cluster1)" opacity="0.8"/>
    <circle cx="38" cy="30" r="4.5" fill="url(#cluster1)" opacity="0.9"/>
    <circle cx="48" cy="35" r="3.5" fill="url(#cluster1)" opacity="0.6"/>
  </g>

  <!-- Cluster 2 (Cyan/Blue - top right) -->
  <g filter="url(#glow)">
    <circle cx="78" cy="32" r="5.5" fill="url(#cluster2)"/>
    <circle cx="88" cy="40" r="4" fill="url(#cluster2)" opacity="0.8"/>
    <circle cx="72" cy="42" r="4.5" fill="url(#cluster2)" opacity="0.7"/>
    <circle cx="82" cy="48" r="3.5" fill="url(#cluster2)" opacity="0.6"/>
    <circle cx="92" cy="30" r="3" fill="url(#cluster2)" opacity="0.5"/>
  </g>

  <!-- Cluster 3 (Orange/Red - bottom) -->
  <g filter="url(#glow)">
    <circle cx="35" cy="80" r="5" fill="url(#cluster3)" opacity="0.9"/>
    <circle cx="45" cy="88" r="4" fill="url(#cluster3)" opacity="0.7"/>
    <circle cx="28" cy="72" r="4" fill="url(#cluster3)" opacity="0.6"/>
    <circle cx="42" cy="75" r="6" fill="url(#cluster3)"/>
    <circle cx="52" cy="82" r="3.5" fill="url(#cluster3)" opacity="0.5"/>
  </g>

  <!-- Cluster 4 (Mixed - bottom right) -->
  <g filter="url(#glow)">
    <circle cx="80" cy="78" r="5" fill="url(#cluster2)" opacity="0.9"/>
    <circle cx="88" cy="70" r="4.5" fill="url(#cluster2)" opacity="0.8"/>
    <circle cx="72" cy="72" r="4" fill="url(#cluster2)" opacity="0.7"/>
    <circle cx="85" cy="85" r="3.5" fill="url(#cluster2)" opacity="0.6"/>
    <circle cx="92" cy="78" r="3" fill="url(#cluster2)" opacity="0.5"/>
  </g>

  <!-- Central scattered points (representing dimensionality reduction in progress) -->
  <g opacity="0.4">
    <circle cx="58" cy="55" r="2" fill="#fff"/>
    <circle cx="65" cy="60" r="1.5" fill="#fff"/>
    <circle cx="55" cy="62" r="1.5" fill="#fff"/>
    <circle cx="62" cy="52" r="1.5" fill="#fff"/>
  </g>

  <!-- Decorative arcs suggesting transformation -->
  <g fill="none" stroke-linecap="round" opacity="0.3">
    <path d="M25 60 Q15 40 30 25" stroke="url(#cluster1)" stroke-width="1.5"/>
    <path d="M95 60 Q105 40 90 25" stroke="url(#cluster2)" stroke-width="1.5"/>
    <path d="M60 95 Q40 105 25 90" stroke="url(#cluster3)" stroke-width="1.5"/>
  </g>
</svg>
